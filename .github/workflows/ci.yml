name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: build the panel
        run: |
          npm ci --prefix web
          npm run build --prefix web

      - name: gofmt
        run: |
          unformatted=$(gofmt -l ./cmd ./internal ./tools)
          if [ -n "$unformatted" ]; then
            echo "unformatted files:"; echo "$unformatted"; exit 1
          fi

      - run: go vet ./...
      - run: go test ./...
      - run: go build ./...

  cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci --prefix web && npm run build --prefix web

      - name: build every target with the panel embedded
        run: |
          set -euo pipefail
          for target in darwin/arm64 darwin/amd64 linux/arm64 linux/amd64; do
            os=${target%/*}; arch=${target#*/}
            echo "== $os/$arch"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X github.com/abcdlsj/weft/internal/weft.AgentVersion=$(git describe --tags --always)" \
              -o /tmp/weft ./cmd/weft
          done
